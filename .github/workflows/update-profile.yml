name: Refresh animated profile

on:
  schedule:
    - cron: '23 8 * * *' # 02:23 America/Mexico_City (UTC-6)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-profile.yml'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: animated-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test contribution pipeline
        run: python -m unittest discover -s tests -v

      - name: Generate current contribution artwork
        env:
          GH_PROFILE_USER: LehiSalvador
        run: python scripts/update_profile.py

      - name: Commit refreshed artwork when changed
        shell: bash
        run: |
          git add data/contributions.json assets/contribution-wave.svg assets/github-metrics.svg
          if git diff --cached --quiet; then
            echo "Contribution artwork is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution artwork [skip ci]"
          git push
